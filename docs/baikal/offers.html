<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baikal Booking · Предложения</title>
  <link rel="stylesheet" href="style.css?v=20260310-5" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar row">
      <div>
        <h1 id="titleLoc">Предложения</h1>
        <p id="subLoc">Загрузка…</p>
      </div>
      <a class="link" href="./index.html">← К маршруту</a>
    </header>

    <section class="card">
      <h3>Ваш маршрут</h3>
      <div id="journeySummary" class="item">Подбираем персональный сценарий…</div>
      <div id="journeyDays" class="item"></div>
    </section>

    <section class="hero-rental card">
      <div class="hero-cover"></div>
      <div class="hero-content">
        <h2>Прокат на Байкале — быстро и красиво</h2>
        <p>SUP, квадроциклы, каяки и другое с прозрачной ценой и подтверждением в пару кликов.</p>
        <button id="goRental" class="book-btn">Выбрать прокат</button>
      </div>
    </section>

    <section class="card">
      <label>Категория</label>
      <div class="cats cats-4">
        <button class="cat-btn active" data-cat="equipment">Техника</button>
        <button class="cat-btn" data-cat="rental">Прокат</button>
        <button class="cat-btn" data-cat="stay">Проживание</button>
        <button class="cat-btn" data-cat="activity">Развлечения</button>
      </div>
    </section>

    <section class="card">
      <h3>Пакеты и подборки</h3>
      <div id="bundles"></div>
    </section>

    <section class="card">
      <div class="row">
        <h3>Каталог</h3>
        <button id="refresh" class="ghost">Обновить</button>
      </div>
      <div class="row">
        <div style="flex:1">
          <label>Начало</label>
          <input id="startAt" type="datetime-local" />
        </div>
        <div style="flex:1">
          <label>Конец</label>
          <input id="endAt" type="datetime-local" />
        </div>
      </div>
      <p class="muted" id="slotStatus">Выбери даты и время для брони</p>
      <div id="list"></div>
    </section>
  </div>
  <div id="calcSheet" class="calc-sheet hidden">
    <div class="calc-card">
      <div class="row"><h3 id="calcTitle">Расчёт</h3><button id="calcClose" class="ghost" style="width:auto">✕</button></div>
      <p id="calcMeta" class="muted"></p>
      <div class="row"><div><small>Период</small><div id="calcPeriod"></div></div><div><small>Залог</small><div id="calcDeposit"></div></div></div>
      <h2 id="calcTotal">0 ₽</h2>
      <button id="calcBook" class="book-btn">Забронировать сейчас</button>
    </div>
  </div>
  <script src="offers.js?v=20260310-5"></script>
</body>
</html>
