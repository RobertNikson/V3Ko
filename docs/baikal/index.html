<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baikal Booking</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Baikal Booking</h1>
        <p>Бронь техники, мест отдыха и развлечений</p>
      </div>
    </header>

    <section class="card map-card">
      <div class="row">
        <label>0) Карта Байкала (быстрый выбор локации)</label>
      </div>
      <svg id="baikalMap" viewBox="0 0 360 180" class="map" aria-label="Карта Байкала">
        <rect x="0" y="0" width="360" height="180" rx="12" fill="#0b162d"/>
        <path d="M190 10 C 210 30, 230 60, 220 90 C 210 120, 205 145, 210 170 C 180 165, 155 150, 145 120 C 135 90, 145 50, 170 20 Z" fill="#1d5fa8" stroke="#6db2ff" stroke-width="2"/>
        <g class="pin" data-name="Листвянка" transform="translate(198,165)"><circle r="6" fill="#ffcc4d"/><text x="10" y="4">Листвянка</text></g>
        <g class="pin" data-name="Ольхон" transform="translate(175,75)"><circle r="6" fill="#ffcc4d"/><text x="10" y="4">Ольхон</text></g>
        <g class="pin" data-name="МРС" transform="translate(160,95)"><circle r="6" fill="#ffcc4d"/><text x="10" y="4">МРС</text></g>
        <g class="pin" data-name="Малое море" transform="translate(155,62)"><circle r="6" fill="#ffcc4d"/><text x="10" y="4">Малое море</text></g>
        <g class="pin" data-name="Бухта Песчаная" transform="translate(210,140)"><circle r="6" fill="#ffcc4d"/><text x="10" y="4">Бухта Песчаная</text></g>
      </svg>
    </section>

    <section class="card">
      <label>1) Локация</label>
      <select id="location"></select>
    </section>

    <section class="card">
      <label>2) Категория</label>
      <div class="cats">
        <button class="cat-btn" data-cat="equipment">Техника</button>
        <button class="cat-btn" data-cat="stay">Места</button>
        <button class="cat-btn" data-cat="activity">Развлечения</button>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <h3>Предложения</h3>
        <button id="refresh" class="ghost">Обновить</button>
      </div>
      <div id="list" class="list"></div>
    </section>

    <section class="card">
      <h3>Для партнёров</h3>
      <p>ИП/ООО могут подключить свои услуги и интеграции.</p>
      <a class="link" href="https://robertnikson.github.io/V3Ko/baikal/partner.html">Открыть кабинет партнёра</a>
    </section>
  </div>
  <script src="app.js?v=3"></script>
</body>
</html>
