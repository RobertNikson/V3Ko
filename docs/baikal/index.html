<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baikal Booking</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Baikal Booking</h1>
      <p>Выберите локацию на Байкале</p>
    </header>

    <section class="card">
      <div class="row">
        <button id="geoBtn">📍 Определить моё гео</button>
        <button id="aiBtn" class="ghost">🤖 ИИ-помощник</button>
      </div>
      <p id="geoStatus" class="muted">Геолокация не определена</p>
    </section>

    <section class="hero-map" id="heroMap">
      <div class="bg-layer" id="seasonBg"></div>
      <img src="./assets/baikal-overlay.png" alt="Интерактивный Байкал" class="baikal-image" />

      <a class="hotspot hs-listvyanka" href="./offers.html?location=Листвянка">Листвянка</a>
      <a class="hotspot hs-olkhon" href="./offers.html?location=Ольхон">Ольхон</a>
      <a class="hotspot hs-mrs" href="./offers.html?location=МРС">МРС</a>
      <a class="hotspot hs-malomore" href="./offers.html?location=Малое море">Малое море</a>
      <a class="hotspot hs-peschanaya" href="./offers.html?location=Бухта Песчаная">Бухта Песчаная</a>
    </section>

    <section class="card">
      <h3>Для партнёров</h3>
      <p>Добавляйте услуги с фото и описанием.</p>
      <a class="link" href="./partner.html">Открыть кабинет партнёра</a>
    </section>
  </div>

  <div id="aiPanel" class="ai-panel hidden">
    <div class="ai-head">ИИ-помощник <button id="aiClose">✕</button></div>
    <div id="aiMsgs" class="ai-msgs"></div>
    <div class="ai-input-wrap">
      <input id="aiInput" placeholder="Спросите, где лучше отдохнуть на Байкале..." />
      <button id="aiSend">Отправить</button>
    </div>
  </div>

  <script src="./index.js?v=2"></script>
</body>
</html>
