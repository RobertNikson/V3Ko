<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baikal Booking</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Baikal Booking</h1>
      <p>Выберите локацию на Байкале</p>
    </header>

    <section class="hero-map">
      <svg class="baikal-illustration" viewBox="0 0 1200 680" aria-label="Байкал">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2a4f89"/>
            <stop offset="100%" stop-color="#0d223f"/>
          </linearGradient>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4fb7ff"/>
            <stop offset="100%" stop-color="#0f5ea8"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="1200" height="680" fill="url(#sky)"/>
        <path d="M620 35 C690 95,760 185,735 300 C710 410,690 530,715 650 C610 635,520 585,475 480 C430 370,450 220,540 95 Z" fill="url(#water)" stroke="#a8dcff" stroke-width="6"/>
        <ellipse cx="565" cy="245" rx="38" ry="18" fill="#7fd2ff" opacity="0.85"/>
        <ellipse cx="705" cy="455" rx="30" ry="12" fill="#7fd2ff" opacity="0.7"/>
      </svg>

      <a class="hotspot hs-listvyanka" href="./offers.html?location=Листвянка">Листвянка</a>
      <a class="hotspot hs-olkhon" href="./offers.html?location=Ольхон">Ольхон</a>
      <a class="hotspot hs-mrs" href="./offers.html?location=МРС">МРС</a>
      <a class="hotspot hs-malomore" href="./offers.html?location=Малое море">Малое море</a>
      <a class="hotspot hs-peschanaya" href="./offers.html?location=Бухта Песчаная">Бухта Песчаная</a>
    </section>

    <section class="card">
      <h3>Для партнёров</h3>
      <p>Добавляйте услуги с фото и описанием.</p>
      <a class="link" href="./partner.html">Открыть кабинет партнёра</a>
    </section>
  </div>
</body>
</html>
