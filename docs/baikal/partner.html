<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baikal Partner Cabinet</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('baikal_session') || 'null');
      if (!s) location.replace('./auth.html');
    } catch {}
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar row">
      <div>
        <h1>Кабинет партнёра</h1>
        <p>Добавление услуг, фото и описания</p>
      </div>
      <a class="link" href="./index.html">← Назад</a>
    </header>

    <section class="card">
      <h3>1) Регистрация партнёра (ИП/ООО)</h3>
      <input id="pName" placeholder="Название партнёра" />
      <select id="pType"><option value="ip">ИП</option><option value="ooo">ООО</option><option value="self_employed">Самозанятый</option></select>
      <input id="pInn" placeholder="ИНН" />
      <input id="pLegal" placeholder="Юр. название" />
      <button id="registerPartner">Зарегистрировать</button>
      <p>Partner ID: <code id="partnerIdOut">—</code></p>
    </section>

    <section class="card">
      <h3>2) Добавить услугу/товар</h3>
      <input id="partnerId" placeholder="Partner ID" />
      <input id="locationName" placeholder="Локация (напр. Листвянка)" />
      <select id="cat"><option value="equipment">Техника</option><option value="stay">Места</option><option value="activity">Развлечения</option></select>
      <input id="title" placeholder="Название услуги" />
      <textarea id="desc" placeholder="Описание услуги"></textarea>
      <input id="price" placeholder="Цена (напр. 4500 ₽ / 2 часа)" />
      <input id="image" placeholder="URL картинки" />
      <button id="addListing">Добавить предложение</button>
    </section>

    <section class="card">
      <h3>3) Партнёрский календарь (доступность + цена)</h3>
      <button id="loadListings">Загрузить мои карточки</button>
      <select id="listingSelect"></select>
      <input id="newPriceLabel" placeholder="Новая цена, напр. 7900 ₽ / ночь" />
      <button id="updatePrice">Обновить цену</button>

      <h4>Слоты доступности</h4>
      <select id="unitSelect"></select>
      <input id="slotStart" type="datetime-local" />
      <input id="slotEnd" type="datetime-local" />
      <select id="slotAvailable"><option value="true">Доступно</option><option value="false">Недоступно</option></select>
      <button id="saveSlot">Сохранить слот</button>
    </section>

    <section class="card">
      <h3>4) Массовый импорт CSV</h3>
      <p class="muted">Формат: <code>category,title,description,price,image_url</code></p>
      <input id="csvFile" type="file" accept=".csv,text/csv" />
      <textarea id="csvData" rows="8" placeholder="category,title,description,price,image_url&#10;equipment,Квадро тур,2 часа по берегу,4500 ₽,https://...&#10;stay,Домик у берега,уютный домик,7900 ₽ / ночь,https://..."></textarea>
      <input id="csvLocationName" placeholder="Локация для импорта (напр. Ольхон)" />
      <button id="validateCsv" class="ghost">Проверить CSV</button>
      <button id="importCsv">Импортировать CSV</button>
      <div id="csvValidation"></div>
      <pre id="out"></pre>
    </section>
  </div>

  <script>
    const API = 'https://rscczdcmlr.tail3f3f1d.ts.net/baikal-api';
    const out = document.getElementById('out');

    async function getLocationIdByName(name){
      const roots = await (await fetch(`${API}/locations`)).json();
      const kids = await (await fetch(`${API}/locations?parentId=${roots[0].id}`)).json();
      return kids.find(x=>x.name.toLowerCase()===name.toLowerCase())?.id || kids[0]?.id;
    }

    document.getElementById('registerPartner').onclick = async () => {
      const body = {
        name: document.getElementById('pName').value,
        partnerType: document.getElementById('pType').value,
        legal: { inn: document.getElementById('pInn').value, legalName: document.getElementById('pLegal').value }
      };
      const r = await fetch(`${API}/partners/register`, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) });
      const j = await r.json();
      document.getElementById('partnerIdOut').textContent = j.id || 'ошибка';
      document.getElementById('partnerId').value = j.id || '';
      out.textContent = JSON.stringify(j, null, 2);
    };

    document.getElementById('addListing').onclick = async () => {
      const partnerId = document.getElementById('partnerId').value.trim();
      const locationName = document.getElementById('locationName').value.trim();
      const locationId = await getLocationIdByName(locationName);

      const body = {
        locationId,
        category: document.getElementById('cat').value,
        title: document.getElementById('title').value,
        description: document.getElementById('desc').value,
        metadata: {
          price_label: document.getElementById('price').value,
          image_url: document.getElementById('image').value
        },
        units: [{ name: 'Юнит #1', capacity: 2 }]
      };
      const r = await fetch(`${API}/partners/${partnerId}/listings`, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) });
      const j = await r.json();
      out.textContent = JSON.stringify(j, null, 2);
    };

    const listingSelect = document.getElementById('listingSelect');
    const unitSelect = document.getElementById('unitSelect');

    async function loadPartnerListings(){
      const partnerId = document.getElementById('partnerId').value.trim();
      const rows = await (await fetch(`${API}/partners/${partnerId}/listings`)).json();
      listingSelect.innerHTML = rows.map(r=>`<option value="${r.id}">${r.title} (${r.category})</option>`).join('');
      if (rows.length) await loadUnits(rows[0].id);
    }

    async function loadUnits(listingId){
      const partnerId = document.getElementById('partnerId').value.trim();
      const rows = await (await fetch(`${API}/partners/${partnerId}/listings/${listingId}/units`)).json();
      unitSelect.innerHTML = rows.map(u=>`<option value="${u.id}">${u.name}</option>`).join('');
    }

    listingSelect.addEventListener('change', ()=> loadUnits(listingSelect.value));

    document.getElementById('loadListings').onclick = loadPartnerListings;

    document.getElementById('updatePrice').onclick = async () => {
      const partnerId = document.getElementById('partnerId').value.trim();
      const listingId = listingSelect.value;
      const priceLabel = document.getElementById('newPriceLabel').value.trim();
      const r = await fetch(`${API}/partners/${partnerId}/listings/${listingId}/price`, {
        method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ priceLabel })
      });
      const j = await r.json();
      out.textContent = JSON.stringify(j, null, 2);
    };

    document.getElementById('saveSlot').onclick = async () => {
      const partnerId = document.getElementById('partnerId').value.trim();
      const body = {
        unitId: unitSelect.value,
        startsAt: new Date(document.getElementById('slotStart').value).toISOString(),
        endsAt: new Date(document.getElementById('slotEnd').value).toISOString(),
        isAvailable: document.getElementById('slotAvailable').value === 'true'
      };
      const r = await fetch(`${API}/partners/${partnerId}/availability/bulk`, {
        method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)
      });
      const j = await r.json();
      out.textContent = JSON.stringify(j, null, 2);
    };

    document.getElementById('csvFile').addEventListener('change', async (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      const txt = await f.text();
      document.getElementById('csvData').value = txt;
    });

    function validateCsvText(csv){
      const validation = document.getElementById('csvValidation');
      const lines = csv.trim().split(/\r?\n/);
      const errors = [];
      if (!lines.length) errors.push('CSV пустой');
      const header = (lines[0] || '').split(',').map(s=>s.trim().toLowerCase());
      const required = ['category','title','description','price','image_url'];
      for (const r of required) if (!header.includes(r)) errors.push(`Нет колонки: ${r}`);

      const idx = (n)=>header.indexOf(n);
      const validCats = new Set(['equipment','stay','activity','rental']);
      for(let i=1;i<lines.length;i++){
        const line = lines[i].trim();
        if(!line) continue;
        const parts = line.split(',').map(s=>s.trim());
        const cat = parts[idx('category')] || '';
        const title = parts[idx('title')] || '';
        const image = parts[idx('image_url')] || '';
        if (!validCats.has(cat)) errors.push(`Строка ${i+1}: category должен быть equipment|stay|activity|rental`);
        if (!title) errors.push(`Строка ${i+1}: пустой title`);
        if (image && !/^https?:\/\//i.test(image)) errors.push(`Строка ${i+1}: image_url должен быть http(s) URL`);
      }

      if (errors.length){
        validation.innerHTML = `<div class="item" style="border-color:#8b2c2c">❌ Найдены ошибки:<br>${errors.map(e=>`• ${e}`).join('<br>')}</div>`;
        return false;
      }
      validation.innerHTML = '<div class="item" style="border-color:#1f7a4a">✅ CSV прошёл валидацию</div>';
      return true;
    }

    document.getElementById('validateCsv').onclick = () => {
      const csv = document.getElementById('csvData').value;
      validateCsvText(csv);
    };

    document.getElementById('importCsv').onclick = async () => {
      const partnerId = document.getElementById('partnerId').value.trim();
      const locationName = document.getElementById('csvLocationName').value.trim();
      const locationId = await getLocationIdByName(locationName);
      const csv = document.getElementById('csvData').value;

      if (!validateCsvText(csv)) return;

      const r = await fetch(`${API}/partners/${partnerId}/import/csv`, {
        method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({ csv, locationId })
      });
      const j = await r.json();
      out.textContent = JSON.stringify(j, null, 2);
    };
  </script>
</body>
</html>
